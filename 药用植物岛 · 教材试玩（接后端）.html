  --animal-focus-yellow:#ffcc00;--animal-success:#6fba2c;--animal-warning:#f5c31c;--animal-error:#e05a5a;
  --animal-ease:cubic-bezier(.4,0,.2,1);--animal-duration-fast:.15s;--animal-duration:.25s;--animal-duration-slow:.35s;
  /* 旧变量名映射，页面里内联样式仍用它们 */
  --bg:#FAF7F0;--card:#FFFDF6;--ink:#49483B;--sub:#7E796A;--acc:#5FAF8E;--accd:#2F826B;
  --gold:#E2B672;--lock:#BDB6A5;--line:#DCD4C2;--ok:#5FAF8E;--bad:#D9886D;--sea:#EAF4EE;--sand:#FFF3D9;
  --sk-bg1:#F2FAF6;--sk-bg2:#E3F1E9;--sk-grass1:#B9E3B2;--sk-grass2:#88CB98;--sk-rim:#FFF3D9;--sk-edge:#6FAF7D;
  --sk-path:#DCCBAA;--sk-path-on:#8FC9A8;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--animal-text-body);font-family:var(--animal-font);font-weight:500;letter-spacing:.01em;font-size:16px;line-height:1.6;
  background:radial-gradient(900px 520px at 50% -220px,#FFFDF8 0%,rgba(255,253,248,0) 72%),#FAF7F0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:700px;margin:0 auto;padding:20px 18px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:22px;line-height:1.32;margin:0;font-weight:900;color:var(--animal-text);letter-spacing:.015em}
#home h1{font-size:31px;letter-spacing:.03em;text-shadow:none}
.homeTag{display:inline-flex;align-items:center;gap:4px;margin:8px 0 10px;padding:5px 14px;border-radius:50px;background:#FFFDF7;border:1.5px solid #E9E2D2;color:var(--animal-text-muted);font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(74,70,56,.045)}
.homeTag .ic{width:16px;height:16px;margin:0}
h2{font-size:19px;margin:0 0 10px;font-weight:800;line-height:1.4;color:var(--animal-text)}
p{line-height:1.7}
.pill{background:#FFFDF7;border:1.5px solid #E9E2D2;border-radius:var(--animal-radius-pill);
  padding:6px 15px;font-weight:800;color:var(--animal-text);box-shadow:0 2px 8px rgba(74,70,56,.045)}
.ic{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin:0 6px 0 0;flex:none;overflow:visible}
.ic.lg{width:24px;height:24px;vertical-align:-6px;margin-right:8px}
.bar{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid #F0C24C;border-radius:var(--animal-radius-pill);padding:0 20px;height:43px;
  background:#FFD966;color:#4D4735;font:800 14px/1 var(--animal-font);letter-spacing:.015em;
  box-shadow:0 4px 0 0 #E2B84C,0 7px 14px rgba(113,93,50,.10);cursor:pointer;transition:transform .14s var(--animal-ease),box-shadow .14s var(--animal-ease),background .14s var(--animal-ease)}
.btn:hover{background:#FFE083;border-color:#F3CA60;transform:translateY(-1px);box-shadow:0 5px 0 0 #E2B84C,0 9px 18px rgba(113,93,50,.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 0 #E2B84C,0 3px 8px rgba(113,93,50,.08)}
.btn:focus-visible{outline:2px solid #7FC9A7;outline-offset:2px}
.btn.alt{background:#FFFDF7;border:1.5px solid #E7DFCE;color:#555243;
  box-shadow:0 3px 0 0 #E7DFCE,0 5px 12px rgba(74,70,56,.045)}
.btn.alt:hover{background:#FFFCF4;border-color:#BBDCC8;color:#2E846C;
  box-shadow:0 4px 0 0 #D8E8DD,0 7px 16px rgba(74,70,56,.07);transform:translateY(-1px)}
.btn.alt:active{transform:translateY(2px);box-shadow:0 1px 0 0 #E7DFCE,0 3px 7px rgba(74,70,56,.05);color:#2E846C;border-color:#BBDCC8}
.heroIcon{width:132px;height:132px;margin:2px auto 14px;border-radius:32px;
  background:var(--logo) center/cover no-repeat;border:3px solid #FFFDF7;box-shadow:0 6px 0 #D8E2CB,0 14px 26px rgba(74,70,56,.12)}
.map{position:relative;height:520px;border-radius:34px;border:1.5px solid #E6E0D2;overflow:hidden;margin:16px 0;background:#EAF4EE;
  box-shadow:0 12px 30px rgba(74,70,56,.065),inset 0 0 0 1px rgba(255,253,247,.9)}
.scene{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;contain:layout paint;
  background-color:var(--sk-bg2,#E3F1E9);
  background-image:radial-gradient(95% 72% at 50% -4%,rgba(255,255,255,.86) 0,rgba(255,255,255,0) 62%),linear-gradient(180deg,var(--sk-bg1,#F2FAF6),var(--sk-bg2,#E3F1E9));
  transition:transform .26s cubic-bezier(.25,.9,.3,1)}
.scene.zooming{transform:scale(1.06)}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(56% 34% at 50% 24%,rgba(255,255,255,.24),rgba(255,255,255,0) 72%)}
.scene::before{content:"";position:absolute;inset:10% 7%;background:linear-gradient(160deg,var(--sk-grass1,#B9E3B2) 0%,var(--sk-grass2,#88CB98) 100%);
  border:10px solid var(--sk-rim,#FFF3D9);
  border-radius:48% 52% 47% 53%/53% 47% 54% 46%;transform:rotate(-2deg);
  box-shadow:0 12px 0 var(--sk-edge,#6FAF7D),0 24px 38px rgba(63,101,72,.16),
    inset 0 5px 12px rgba(255,255,255,.34),inset 0 -14px 22px rgba(50,116,74,.10)}
#arch .scene::before{inset:5.5% 4%;transform:rotate(-1.5deg)}
.scene > svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.nd.launch{animation:tapPop .34s cubic-bezier(.34,1.56,.64,1) both;z-index:4}
@keyframes tapPop{0%{transform:translate(-50%,-50%) scale(1)}22%{transform:translate(-50%,-50%) scale(.92)}48%{transform:translate(-50%,-52%) scale(1.17)}72%{transform:translate(-50%,-51%) scale(1.08)}100%{transform:translate(-50%,-51%) scale(1.12)}}
.dc{display:none}
.nd{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:0;cursor:pointer;font-family:inherit;color:var(--animal-text);width:118px;padding:0;z-index:3;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.nd:hover{transform:translate(-50%,-55%) scale(1.025)}
.nd i{--face:#FFF9EC;--edge:#D8CEB8;--glow:rgba(72,86,64,.14);font-style:normal;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;line-height:0;font-size:27px;
  background:linear-gradient(180deg,#FFFEF9 0%,var(--face) 100%);border:1.5px solid #E8DFCC;
  box-shadow:0 6px 0 var(--edge),0 12px 19px var(--glow),inset 0 2px 0 rgba(255,255,255,.9);
  position:relative;transition:transform .18s var(--animal-ease),box-shadow .18s var(--animal-ease)}
.nd i::before{content:"";position:absolute;left:16%;right:16%;top:5%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0));pointer-events:none}
.nd i.is{width:86px;height:86px;border-width:2px;box-shadow:0 9px 0 var(--edge),0 18px 28px var(--glow),inset 0 3px 0 rgba(255,255,255,.9)}
.nd b{font-size:12px;font-weight:700;line-height:1.42;background:rgba(255,253,247,.94);border:1px solid #E9E1D1;border-radius:11px;
  padding:2px 9px;color:#5A5748;box-shadow:0 2px 7px rgba(74,70,56,.05);backdrop-filter:blur(2px)}
.nd .sub{font-size:11px;line-height:1.45;background:rgba(255,253,247,.82);border:1px solid rgba(233,225,209,.85);border-radius:10px;padding:1px 8px;margin-top:1px;box-shadow:none;color:#777263}
.locked i{background:#F7F4EB;border-color:#E3DCCB;opacity:1}
.locked .ic{opacity:.42}
.lk,.ms{position:absolute;width:22px;height:22px;border-radius:50%;background:#FFFDF7;border:1px solid #E5DDCC;display:grid;place-items:center;text-decoration:none;box-shadow:0 2px 5px rgba(74,70,56,.10);z-index:2}
.lk{right:-6px;bottom:-6px}
.ms{right:-7px;top:-8px}
.lk .ic,.ms .ic{width:13px;height:13px;margin:0}
.avail i{--face:#DDF4E9;--edge:#5DAE8C;--glow:rgba(58,142,111,.22);border-color:#8FD2B4}
.lit i,.master i{--face:#FFE7BC;--edge:#C99A54;--glow:rgba(176,128,63,.20);border-color:#E8BE7B}
.review i{--face:#EFE9DA;--edge:#C8BEAA;--glow:rgba(112,104,86,.12);border-color:#DDD3C2}
@media (prefers-reduced-motion:reduce){.avail i{animation:none}/* 旧的全局禁用动效规则已移除，改由各组件自己控制节奏 */}
.lg{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--animal-text-muted);margin-top:6px;align-items:center}
.sw{width:15px;height:15px;border-radius:50%;display:inline-block;background:#fff;border:2px solid #7FC9A7;vertical-align:-3px;margin-right:4px}
.sw.gold{background:#FFE7BC;border-color:#E2B672}
.sw.dim{opacity:.4;filter:grayscale(1)}
.skic{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
.skic.gold{color:#D8A455}
.chip{width:24px;height:24px;border-radius:9px;display:inline-block;vertical-align:-7px;margin-right:7px;border:2px solid #FFFDF7;box-shadow:0 2px 5px rgba(74,70,56,.08)}
.upic{width:54px;height:54px;display:block}
.lg span{background:#FFFDF7;border:1px solid #E9E1D1;border-radius:var(--animal-radius-pill);padding:3px 10px}
.ov{position:fixed;inset:0;background:rgba(66,62,50,.28);display:none;align-items:center;justify-content:center;
  padding:16px;z-index:5;animation:fade .23s ease}
.ov.on{display:flex}
.ov.closing{animation:fadeOut .18s ease forwards;pointer-events:none}
.ov.closing .sh.anim{animation:panelOut .16s cubic-bezier(.4,0,.7,.2) forwards}
.sh{background:#FFFCF4;color:var(--animal-text-body);width:100%;max-width:560px;max-height:92vh;overflow:auto;
  padding:clamp(40px,7.6vw,52px) clamp(32px,6.6vw,44px) clamp(26px,5vw,34px);
  border:1.5px solid #E9E1D0;border-radius:42px 46px 40px 48px/46px 40px 48px 42px;
  box-shadow:0 18px 46px rgba(68,63,49,.16),inset 0 1px 0 #FFFDF8;user-select:text}
.sh.anim{animation:panelIn .24s cubic-bezier(.34,1.56,.64,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes panelIn{from{opacity:0;transform:scale(.965) translateY(10px)}to{opacity:1;transform:none}}
@keyframes panelOut{to{opacity:0;transform:scale(.97) translateY(6px)}}
.sh h2:first-child{font-size:23px;font-weight:800;color:#4E4C3E;line-height:1.4;padding-bottom:11px;padding-left:22px;margin-bottom:14px;position:relative}
.sh h2:first-child::after{content:"";position:absolute;left:22px;bottom:0;width:42px;height:3px;border-radius:4px;background:linear-gradient(90deg,#7FC9A7,#CBE9D6)}
.tabs{display:flex;gap:5px;margin:14px 0;padding:5px;background:#F6F2E8;border:1px solid #E9E1D0;border-radius:var(--animal-radius-pill)}
.tab{flex:1;padding:9px 4px;border-radius:var(--animal-radius-pill);border:0;background:transparent;color:#817B6B;
  font:700 14px/1.2 var(--animal-font);cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.tab:hover{background:rgba(127,201,167,.11);color:#5B5748}
.tab.on{background:#DFF4E9;color:#2F826B;box-shadow:0 2px 0 #B8DDCB}
.txt{background:#FFFEF9;border:1px solid #EAE2D1;border-radius:16px;padding:15px 16px;
  line-height:1.9;color:var(--animal-text-body);min-height:88px}
.sub{color:var(--animal-text-muted);font-size:13px;line-height:1.7}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:12px 15px;border-radius:15px;
  border:1px solid #E9E1D1;background:#FFFEF9;color:var(--animal-text-body);font:600 15px/1.6 var(--animal-font);
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .18s ease,background .18s ease,box-shadow .18s ease}
.opt:hover{border-color:#A9D8BF;background:#FFFEFA;transform:translateY(-1px);box-shadow:0 4px 12px rgba(74,70,56,.06)}
.opt:active{transform:scale(.98);box-shadow:none}
.opt.ok{background:#5FAF8E;border-color:#5FAF8E;color:#FFFDF7}
.opt.ok:hover{background:#5FAF8E;border-color:#5FAF8E;color:#FFFDF7}
.opt.sel{border-color:#7FC9A7;background:#EAF7F0}
.opt.bad{border-color:#D9886D;animation:sk .3s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.sk{position:relative;display:block;width:100%;padding:0;border:1px solid #E9E1D1;border-radius:18px;background:#FFFEF9;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;color:var(--animal-text-body);box-shadow:0 3px 0 #E4DCCB,0 5px 12px rgba(74,70,56,.04);transition:transform .18s var(--animal-ease),box-shadow .18s var(--animal-ease),border-color .18s var(--animal-ease)}
.sk:hover{transform:translateY(-2px);box-shadow:0 5px 0 #E4DCCB,0 8px 18px rgba(74,70,56,.06)}
.sk:active{transform:scale(.97);box-shadow:0 1px 0 #E4DCCB}
.sk.cur{border-color:#8FD2B4;box-shadow:0 0 0 3px rgba(127,201,167,.14),0 3px 0 #CFE2D6}
.skprev{display:block;position:relative;height:72px;background:linear-gradient(160deg,var(--p1),var(--p2));border-bottom:1px solid #E9E1D1;overflow:hidden}
.skprev i{position:absolute;left:50%;top:55%;width:62px;height:40px;transform:translate(-50%,-50%);border-radius:48% 52% 46% 54%/54% 46% 56% 44%;background:var(--p3);border:3px solid #FFF3DA;box-shadow:0 5px 0 var(--p4),0 8px 12px rgba(70,80,60,.10)}
.skprev em{display:none}
.skmeta{display:block;padding:7px 10px 9px}
.skmeta b{display:block;font-size:13px;font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skmeta small{display:block;font-size:11px;color:var(--animal-text-muted);line-height:1.4;margin-top:1px}
.sknow{position:absolute;right:8px;top:8px;padding:2px 7px;border-radius:20px;background:#4FA985;color:#FFFDF7;font-size:10.5px;font-weight:800;box-shadow:0 2px 0 #3B8B69}
.skshop{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--animal-text-muted);margin-top:6px}
@media (max-width:380px){.skins{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:#4F4C3E;color:#FFFDF7;padding:10px 19px;border-radius:var(--animal-radius-pill);
  font-weight:700;font-size:14px;opacity:0;transition:.28s;pointer-events:none;z-index:9;box-shadow:0 8px 22px rgba(61,52,40,.18)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed #DCD4C2;
  border-radius:22px;padding:34px 18px;background:#FFFCF5;cursor:pointer;margin:20px 0;text-align:center;
  transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
.drop:hover,.drop.on{border-color:#9AD3B8;background:#FFFDF8;box-shadow:0 6px 18px rgba(74,70,56,.06)}
.drop b{font-size:15px;font-weight:800}
.nd i.is{width:86px;height:86px;font-size:34px;border-radius:50%;background:linear-gradient(180deg,#FFFEF9,var(--face,#FFF6E6));border-color:#E5DBC7}
.nd i.open{border-color:#79C6A4;background:#EAF8F1;outline:2px solid rgba(95,175,142,.12);outline-offset:2px}
.nd i.full{background:#FFE7BC;border-color:#E8BE7B}
.nd i.wait{opacity:.9}
.pn{position:absolute;left:-6px;top:-4px;width:22px;height:22px;border-radius:50%;background:#FFFDF7;border:1px solid #E5DDCC;display:grid;place-items:center;text-decoration:none;box-shadow:0 2px 5px rgba(74,70,56,.10);z-index:2}
.pn .ic{width:12px;height:12px;margin:0}
.pc{left:calc(50% + 31px);top:-6px;padding:0;cursor:pointer;background:#FFF4D9;border-color:#E8D2A5;box-shadow:0 2px 6px rgba(151,121,65,.14)}
.pc .ic{width:13px;height:13px}
.pc.off{opacity:.26;filter:grayscale(1);background:#FFFDF7;border-color:#E5DDCC}
.dim{opacity:.35}
code{background:#F1EBDE;border-radius:8px;padding:1px 6px;font-size:12px;color:var(--animal-text-body)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
::selection{background:#D9EFE3;color:#3F4A3C}

/* 补充资料 & 重点补录 */
.mynote{margin:10px 0;padding:11px 13px;border:1px solid #E8DFC9;border-radius:14px;background:#FFF9E9;color:#5B5645;font-size:13.5px;line-height:1.7}
.mynote b{color:#2F826B}
.mynote .row{margin-top:8px;justify-content:flex-start}
.supbox{border:1.5px dashed #DCD4C2;border-radius:18px;background:#FFFCF5;padding:18px;text-align:center;margin:12px 0}
.supbox .ic{width:34px;height:34px;margin:0 0 6px;opacity:.75}
.supbox b{display:block;font-size:14px;margin-bottom:3px}
.supbox .sub{margin:0}
.sflist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.sfitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #E9E1D1;border-radius:11px;background:#FFFEF9;font-size:12.5px;color:#65604F}
.sfitem .ic{width:15px;height:15px;margin:0;opacity:.6}
.sfitem .st{margin-left:auto;color:#8B8575;font-size:11.5px}
.sfitem .st.ok{color:#2F826B}
.sfitem .st.err{color:#B4553F}
textarea.ta{width:100%;min-height:78px;resize:vertical;border:1px solid #E4DCCB;border-radius:13px;background:#FFFEF9;padding:10px 12px;color:var(--animal-text-body);font:500 13.5px/1.7 var(--animal-font);outline:none}
textarea.ta:focus{border-color:#9AD3B8;box-shadow:0 0 0 3px rgba(127,201,167,.12)}


/* ============ 交互流畅度 & 状态辨识 ============ */
:root{--ui-spring:cubic-bezier(.34,1.56,.64,1);--ui-ease:cubic-bezier(.22,.9,.28,1)}
body.modal-open{overflow:hidden}
#ov{z-index:80;background:rgba(56,54,44,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);will-change:opacity}
#sheet{position:relative;overscroll-behavior:contain}
#sheet .shbar{position:sticky;top:-18px;height:0;display:flex;justify-content:flex-end;z-index:8;pointer-events:none}
#sheet .shx{pointer-events:auto;width:38px;height:38px;margin:-16px -8px 0 0;border-radius:50%;
  border:1.5px solid #E7DFCE;background:#FFFDF7;color:#6D6759;font:900 21px/1 var(--animal-font);
  display:grid;place-items:center;box-shadow:0 3px 0 #E7DFCE,0 5px 12px rgba(74,70,56,.06);
  cursor:pointer;transition:transform .16s var(--ui-spring),background .16s,box-shadow .16s}
#sheet .shx:hover{background:#FFF6E2;color:#4E4C3E;transform:translateY(-1px);box-shadow:0 4px 0 #E2D6BC,0 7px 16px rgba(74,70,56,.08)}
#sheet .shx:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 #E7DFCE}
#sheet .shx:focus-visible{outline:2px solid #7FC9A7;outline-offset:2px}
#sheet h2:first-of-type{font-size:23px;font-weight:800;color:#4E4C3E;line-height:1.4;padding-bottom:11px;padding-left:22px;padding-right:46px;margin-bottom:14px;position:relative}
#sheet h2:first-of-type::after{content:"";position:absolute;left:22px;bottom:0;width:42px;height:3px;border-radius:4px;background:linear-gradient(90deg,#7FC9A7,#CBE9D6)}

/* 知识点四态：迷雾 / 可挑战 / 已点亮 / 精通，另有“该复习” */
.nd.locked{opacity:.7;cursor:not-allowed;filter:saturate(.55)}
.nd.locked:hover{transform:translate(-50%,-50%) scale(1)}
.nd.locked i{border-style:dashed;border-color:#CFC7B5;background:linear-gradient(180deg,#FEFCF5,#F4F0E4);
  box-shadow:0 4px 0 #E2DAC8,0 8px 14px rgba(72,86,64,.08)}
.nd.locked b{color:#938C7B;border-color:#E4DDCE;background:rgba(255,253,247,.82)}
.nd.avail i{border-color:#79C6A4;background:linear-gradient(180deg,#F3FFF9,#DDF4E9);
  box-shadow:0 6px 0 #5DAE8C,0 12px 22px rgba(58,142,111,.24),inset 0 2px 0 rgba(255,255,255,.92)}
.nd.avail i::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(95,175,142,.34);
  pointer-events:none;animation:availRing 2.2s ease-out infinite}
.nd.avail b{border-color:#9FD3BB;color:#2F6F57;background:rgba(240,255,248,.96)}
.nd.lit i{border-color:#DFB36B;background:linear-gradient(180deg,#FFF9EA,#FFE7BC);
  box-shadow:0 6px 0 #C99A54,0 12px 20px rgba(176,128,63,.20),inset 0 2px 0 rgba(255,255,255,.92)}
.nd.lit b{border-color:#E8CE98;background:rgba(255,250,236,.96)}
.nd.master i{border-color:#D9A84F;box-shadow:0 6px 0 #B9853D,0 0 0 4px rgba(233,196,106,.12),0 14px 26px rgba(176,128,63,.22)}
.nd.master b{border-color:#E4C47E;background:rgba(255,248,226,.98);color:#72562B}
.nd.review{opacity:.84}
.nd.review i{filter:saturate(.72);border-color:#C9C0AC;background:linear-gradient(180deg,#FCF8ED,#EEE7D7);box-shadow:0 5px 0 #C8BEAA,0 9px 16px rgba(112,104,86,.12)}
.nd.review b{border-color:#DCD1BD;color:#746E5C}
.ck,.rv{position:absolute;width:22px;height:22px;border-radius:50%;background:#FFFDF7;border:1px solid #E5DDCC;display:grid;place-items:center;text-decoration:none;box-shadow:0 2px 5px rgba(74,70,56,.10);z-index:2}
.ck{right:-6px;bottom:-6px}
.ck .ic{width:13px;height:13px;margin:0}
.rv{right:-7px;top:-8px;width:auto;min-width:22px;padding:0 5px;border-radius:9px;background:#F4F0E4;color:#7B7462;font:800 10px/20px var(--animal-font);letter-spacing:.02em}
.nd.locked .lk{background:#F4F0E4;border-color:#DCD3C1}
.sw.pulse{border-color:#5FAF8E;box-shadow:0 0 0 0 rgba(95,175,142,.26);animation:legendPulse 2.2s ease-out infinite}

/* 连线：已通 / 下一步可走 / 迷雾 */
.scene svg line.pl{transition:stroke .28s ease,opacity .28s ease}
.pl-done{stroke:var(--sk-path-on);stroke-width:4;opacity:1;filter:drop-shadow(0 1px 1px rgba(60,110,80,.12))}
.pl-open{stroke:var(--sk-path-on);stroke-width:3.4;stroke-dasharray:6 7;opacity:.95;animation:pathFlow 1.6s linear infinite}
.pl-lock{stroke:var(--sk-path);stroke-width:2.4;stroke-dasharray:2 9;opacity:.5}

/* 地图上的小进度条与进入动效 */
.mapstat{position:absolute;left:14px;top:14px;z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  max-width:calc(100% - 28px);padding:4px 10px;border-radius:999px;background:rgba(255,253,247,.82);
  border:1px solid rgba(233,225,209,.9);box-shadow:0 3px 10px rgba(74,70,56,.05);backdrop-filter:blur(4px);
  font:800 11px/1.6 var(--animal-font);color:#716B5B;pointer-events:none}
.mapstat em{font-style:normal;white-space:nowrap}
.mapstat em.hot{color:#2F826B}
.scene.new .nd:not(.launch){animation:nodeIn .38s var(--ui-spring) both;animation-delay:calc(var(--i,0) * 34ms)}
@keyframes nodeIn{from{opacity:0;transform:translate(-50%,-44%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes availRing{0%{opacity:.72;transform:scale(.92)}70%{opacity:0;transform:scale(1.14)}100%{opacity:0;transform:scale(1.14)}}
@keyframes pathFlow{to{stroke-dashoffset:-26}}
@keyframes legendPulse{0%{box-shadow:0 0 0 0 rgba(95,175,142,.28)}70%{box-shadow:0 0 0 7px rgba(95,175,142,0)}100%{box-shadow:0 0 0 0 rgba(95,175,142,0)}}

.nd.ch-open i::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(95,175,142,.32);pointer-events:none;animation:availRing 2.2s ease-out infinite}
.nd.ch-wait{opacity:.76;filter:saturate(.62)}
.nd.ch-wait:hover{transform:translate(-50%,-50%) scale(1)}
.nd.ch-full i{border-color:#D9A84F;box-shadow:0 9px 0 #B9853D,0 0 0 5px rgba(233,196,106,.12),0 18px 28px rgba(176,128,63,.20)}

/* 详情页状态标签与来源行 */
.statepill{display:inline-flex;align-items:center;height:23px;padding:0 9px;margin-left:8px;border-radius:999px;
  vertical-align:2px;font:800 11px/23px var(--animal-font);letter-spacing:.02em;border:1px solid #DCD4C2;color:#7B7462;background:#F6F2E8}
.statepill.avail{color:#2F6F57;border-color:#A8D9C3;background:#EAF8F1}
.statepill.lit,.statepill.master{color:#7A5B24;border-color:#E6C98C;background:#FFF5DA}
.statepill.review{color:#7D735D;background:#F3EEE0}
.srcrow{margin:10px 0 2px}

/* 闯关：进度、题号、反馈、结算 */
.qbar{display:flex;align-items:center;gap:10px;margin:2px 0 13px}
.qbar .qprog{flex:1;height:7px;border-radius:99px;background:#F0EADB;border:1px solid #E7DFCE;overflow:hidden}
.qbar .qprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8FD2B4,#5FAF8E);transition:width .28s var(--ui-ease)}
.qbar .qcount{font:800 11px/1.4 var(--animal-font);color:#7B7462;white-space:nowrap}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;color:#8A8372;font-size:12px}
.qkind{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:#EDF7F1;border:1px solid #C7E4D5;color:#2F6F57;font:800 11px/22px var(--animal-font)}
.opt.haskey{display:flex;gap:10px;align-items:flex-start}
.opt .key{flex:0 0 24px;height:24px;border-radius:8px;background:#F6F2E8;border:1px solid #E3DAC9;color:#7A7463;
  display:grid;place-items:center;font:800 12px/24px var(--animal-font);margin-top:1px}
.opt.haskey .key{background:#EAF8F1;border-color:#A8D9C3;color:#2F6F57}
.opt.ok .key{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.38);color:#FFFDF7}
.feedback{margin:11px 0 0;padding:10px 13px;border-radius:13px;font-size:14px;line-height:1.7;border:1px solid #E9E1D1;background:#FFFEF9;color:#5F5C4D}
.feedback.ok{background:#EAF8F1;border-color:#BFE2D1;color:#2F6F57}
.feedback.bad{background:#FFF2EC;border-color:#EFC7B8;color:#9B543F}
.orderlist{display:flex;flex-direction:column;gap:7px;margin:5px 0 12px}
.orderstep{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:#F6FBF7;border:1px solid #DCEEDF;font-size:14px;line-height:1.6}
.stepnum{flex:0 0 22px;height:22px;border-radius:50%;background:#5FAF8E;color:#FFFDF7;display:grid;place-items:center;font:800 11px/22px var(--animal-font)}
.resultbox{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;border:1px solid #E9DFC7;background:linear-gradient(180deg,#FFFEF9,#FFF8E8)}
.stars{color:#D5A246;font-size:22px;letter-spacing:2px;line-height:1}
.resultbox b{font-size:16px;color:#6B5330}
.resultbox span{font-size:12px;color:#837B69}
button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none!important;transform:none!important}
.toast{z-index:120}

/* 皮肤卡片切换时只做局部更新 */
.sk.cur .skprev i{animation:skinNudge .36s var(--ui-spring)}
@keyframes skinNudge{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-54%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}

@media (prefers-reduced-motion:reduce){
  .scene.new .nd:not(.launch),.nd.avail i::after,.pl-open,.sw.pulse,.sk.cur .skprev i{animation:none!important}
  #ov,.sh, .nd, .nd i, .btn, .opt{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

<script>
const ico=n=>`<svg class="ic" viewBox="0 0 48 48"><use href="#i-${n}"></use></svg>`;
const EI={'📖':'book','🌿':'leaf','⚗️':'flask','🥜':'acorn','🌾':'wheat','🧵':'rope','🧴':'soap','🌸':'flower','☠️':'skull','🎨':'palette','🍵':'tea','🫧':'sparkles','🔊':'speaker','📡':'sparkles','👑':'crown'};
const ec=(e,s=22)=>EI[e]?`<svg class="ic" style="width:${s}px;height:${s}px;margin:0" viewBox="0 0 48 48"><use href="#i-${EI[e]}"></use></svg>`:e;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-c]');if(!el)return;
  const m=el.getAttribute('data-c').match(/^(\w+)\((.*)\)$/);if(!m)return;
  const a=m[2]?m[2].split(',').map(x=>{x=x.trim().replace(/^'|'$/g,'');return x!==''&&!isNaN(x)?+x:x}):[];
  const run=()=>{try{return window[m[1]](...a)}catch(err){console.error(err);tst('操作失败：'+err.message)}};
  const mp=el.closest('.map');
  const sc=mp&&mp.querySelector('.scene');
  if(el.classList.contains('nd')&&mp&&sc&&(m[1]==='op'||m[1]==='ent')&&!el.classList.contains('locked')&&!el.classList.contains('ch-wait')&&mp.dataset.z!=='1'){
    mp.dataset.z='1';
    const x=parseFloat(el.style.left)||50,y=parseFloat(el.style.top)||50;
    sc.style.transformOrigin=`${x}% ${y}%`;
    el.classList.add('launch');
    setTimeout(()=>sc.classList.add('zooming'),90);
    setTimeout(()=>{
      run();
      setTimeout(()=>{sc.classList.remove('zooming');sc.style.transformOrigin='';el.classList.remove('launch');mp.dataset.z='0'},180);
    },300);
    return;
  }
  run();
});
document.addEventListener('click',e=>{if(e.target.id==='ov')cl()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
const $=i=>document.getElementById(i),R=[0,10,20,30],L=['','勉强通过','掌握','精通'];
/* 真实数据从后端 play-data 灌进来；示例数据留在 DEMO_* 里，作为离线对照 */
let N={},CH=[],SC={},AM={},CM={};
let CUR={doc:'',title:'',filename:'',chapters:0,sections:0,knowledge:0,pending:0,pageOffset:0};
let VIEW={sid:'',ch:0,se:0};
const SECTIONS=n=>Object.keys(SC[String(n)]||[]).map(i=>SC[String(n)][i]);
function sid_of(n,i){return n+'.'+(i+1)}
function curNodes(){const list=Object.keys(N);return VIEW.sid?list.filter(i=>N[i].sid===VIEW.sid):list}
const nodesOf=(n,i)=>Object.keys(N).filter(k=>N[k].sid===sid_of(n,i));
/* 课程数据来自 data/course-data.js，新增章节/知识点只改那里 */
const CD=window.ISLAND_COURSE;
if(!CD){document.getElementById('hint').textContent='课程数据没加载：确认 data/course-data.js 和 HTML 在同一目录。';throw new Error('ISLAND_COURSE missing')}
const SK=CD.skins;

const D=()=>({sh:0,st:{},due:{},own:['def'],skin:'def',doc:0,seen:0,up:'',mk:{},cm:{},fo:0,wrong:{},notes:{},focus:'',cfg:{qn:3,rel:1,ai:1},since:0,rec:[]});
let S=D(),tab=0,cur=0,g={};
function key(){return 'island_v2_'+(CUR.doc||'demo')}
function loadState(){S=D();try{const t=localStorage.getItem(key());if(t){const o=JSON.parse(t);S=Object.assign(D(),o);S.cfg=Object.assign({qn:3,rel:1,ai:1},o.cfg);S.notes=S.notes||{};S.focus=S.focus||''}}catch(e){}applySkin()}
function sv(){try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){}}
function applySkin(){
 const k=SK[S.skin]||SK.def,st=document.documentElement.style;
 st.setProperty('--sk-bg1',k.bg1);
 st.setProperty('--sk-bg2',k.bg2);
 st.setProperty('--sk-grass1',k.grass1);
 st.setProperty('--sk-grass2',k.grass2);
 st.setProperty('--sk-rim',k.rim);
 st.setProperty('--sk-edge',k.edge);
 st.setProperty('--sk-path',k.path);
 st.setProperty('--sk-path-on',k.pathOn);
}
const done=i=>S.st[i]>0,stat=i=>done(i)?(S.due[i]?'review':S.st[i]==3?'master':'lit'):(N[i].pre.every(done)?'avail':'locked');
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function tst(m){const t=$('tt');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),1800)}
let lastFocus=null, closeT=0;
function show(h,opt={}){
 const s=$('sheet'),ov=$('ov'),wasOpen=ov.classList.contains('on')&&!ov.classList.contains('closing');
 clearTimeout(closeT);ov.classList.remove('closing');
 if(!wasOpen){
  lastFocus=document.activeElement;
  ov.classList.add('on');document.body.classList.add('modal-open');
  s.classList.remove('anim');void s.offsetWidth;s.classList.add('anim');
 }
 s.dataset.panel=(opt&&opt.kind)||'default';
 s.innerHTML=`<div class="shbar"><button type="button" class="shx" data-c="cl()" aria-label="关闭">×</button></div>`+h;
 s.scrollTop=0;
 requestAnimationFrame(()=>{s.scrollTop=0;if(!wasOpen){const x=s.querySelector('.shx');if(x)x.focus({preventScroll:true})}});
}
function cl(){
 const ov=$('ov');if(!ov.classList.contains('on')||ov.classList.contains('closing'))return;
 ov.classList.add('closing');clearTimeout(closeT);
 closeT=setTimeout(()=>{
  ov.classList.remove('on','closing');document.body.classList.remove('modal-open');$('sheet').classList.remove('anim');
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus({preventScroll:true})}catch(e){}}
 },220);
}
let freshPath=0;
const STWORD={locked:'迷雾中',avail:'可挑战',lit:'已点亮',master:'已精通',review:'该复习'};
function map(animate){
 const k=SK[S.skin]||SK.def;applySkin();
 const ids=curNodes();
 let s='<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
 ids.forEach(i=>{
  const pre=N[i].pre||[];
  pre.forEach(p=>{
   if(!N[p])return;
   const a=N[p].pos,b=N[i].pos,dst=stat(i);
   const cls=done(p)&&done(i)?'pl-done':(done(p)&&dst==='avail'?'pl-open':'pl-lock');
   s+=`<line class="pl ${cls}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
 });
 s+='</svg>';
 ids.forEach((i,idx)=>{
  const n=N[i],st=stat(i),pre=(n.pre||[]);
  const unmetKey=pre.find(p=>N[p]&&!done(p));
  const unmetName=unmetKey?N[unmetKey].t:'前面的据点';
  const stateText=st==='locked'?('迷雾中：先完成「'+unmetName+'」'):(st==='avail'?'现在可挑战':st==='master'?'已精通':st==='review'?'该复习了':'已点亮');
  const marks=(imp(i)?'<s class="pn">'+ico('bookmark')+'</s>':'')+
   (st==='locked'?'<s class="lk">'+ico('lock')+'</s>':'')+
   (st==='lit'?'<s class="ck">'+ico('check-circle')+'</s>':'')+
   (st==='master'?'<s class="ms">'+ico('star')+'</s>':'')+
   (st==='review'?'<s class="rv">复</s>':'');
  s+=`<button class="nd ${st}${S.fo&&!imp(i)?' dim':''}" style="left:${n.pos[0]}%;top:${n.pos[1]}%;--i:${idx}" data-c="op(${i})" aria-label="${esc(n.t+'，'+stateText)}" title="${esc(stateText)}"><i>${ec(n.e,32)}${marks}</i><b>${esc(n.t)}</b></button>`;
 });
 const lit=ids.filter(i=>done(i)).length,mastered=ids.filter(i=>stat(i)==='master').length,open=ids.filter(i=>stat(i)==='avail').length,review=ids.filter(i=>stat(i)==='review').length;
 const chips=`<em>已学 ${lit}/${ids.length}</em>${mastered?`<em>精通 ${mastered}</em>`:''}${open?`<em class="hot">可挑战 ${open}</em>`:''}${review?`<em>待复习 ${review}</em>`:''}`;
 $('map').innerHTML=`<div class="mapstat">${chips}</div><div class="scene${(animate||freshPath)?' new':''}">${s}</div>`;freshPath=0;
 $('sh').innerHTML=$('sh2').innerHTML='🐚 '+S.sh;const fbtxt=ico('star')+(S.fo?'重点模式：开':'重点模式');$('fb').innerHTML=$('fb2').innerHTML=fbtxt;am();$('wc').textContent=Object.keys(S.wrong).length;$('tqb').innerHTML=ico('clipboard')+(qd()?'总习题 ❗':'总习题');sv();
}
function op(i){
 const st=stat(i);
 if(st==='locked'){
  const pending=(N[i].pre||[]).filter(p=>N[p]&&!done(p)).map(p=>N[p]);
  const name=pending.length?pending[0].t:'前面的据点';
  return tst(pending.length>1?`迷雾还没散：先点亮「${name}」等 ${pending.length} 个据点，路才会开放。`:`「${N[i].t}」还在迷雾里：先点亮「${name}」，路就会开放。`);
 }
 if(!N[i].g)return tst('这个据点还没生成闯关题，先看讲解吧');
 cur=i;tab=0;learn();
}
function tb(i){tab=i;learn()}
function learn(){
 const n=N[cur],T=['原文','大白话','类比','图解'],c=[n.o,n.p,n.a,n.svg||'图解由 AI 根据内容自动生成，这个试玩版暂未生成。'][tab],nt=S.notes[cur]||'',st=stat(cur);
 const src=n.sources&&n.sources.length?('来源：'+n.sources.map(x=>esc(x.sourceName||'资料')+' p.'+(x.sourcePage||x.pageStart||'?')).join('；')):('来源：《'+esc(CUR.title||CUR.filename||'教材')+'》第 '+esc(n.pg)+' 页');
 const canGo=!!n.g;
 show(`<h2 style="margin:0">${esc(n.t)}<span class="statepill ${st}">${STWORD[st]}</span></h2>
  <div class="tabs">${T.map((x,i)=>`<button class="tab ${i==tab?'on':''}" data-c="tb(${i})">${x}</button>`).join('')}</div>
  <div class="txt">${c}</div>
  <p class="sub srcrow">${src}${CUR.course?' · 合集':''}</p>
  ${mkr(cur)}
  ${S.focus?`<div class="mynote"><b>${ico('star')}重点方向</b><br>${esc(S.focus)}</div>`:''}
  <div class="mynote"><b>${ico('bookmark')}我的补充重点</b><br>${nt?esc(nt):'<span class="sub">AI 没抓到的重点，可以自己补在这里，会一直保存在当前书本里。</span>'}<div class="row"><button class="btn alt" style="padding:6px 14px;font-size:13px" data-c="note()">${nt?'修改这条重点':'补一条重点'}</button></div></div>
  <div class="row"><button class="btn alt" data-c="cl()">回小岛</button>${canGo?'<button class="btn" data-c="go()">开始闯关</button>':'<button class="btn" disabled>暂无题目</button>'}</div>`);
}
function note(){const v=S.notes[cur]||'';show(`<h2 style="margin:0">补一条重点</h2><p class="sub">写给自己的重点提示，会显示在「${esc(N[cur].t)}」的讲解里。</p><textarea class="ta" id="nt" placeholder="例如：超临界 CO₂ 的关键条件是 31.3℃、7.38 MPa，务必记住。">${esc(v)}</textarea><div class="row"><button class="btn alt" data-c="cl()">取消</button><button class="btn" data-c="saven()">保存重点</button></div>`)}
function saven(){const v=($('nt').value||'').trim();if(v)S.notes[cur]=v;else delete S.notes[cur];sv();learn();tst(v?'已补进这个知识点的重点':'已清空这条重点')}
function qbar(now,total,label){
 const p=total?Math.max(0,Math.min(100,Math.round(now/total*100))):0;
 return `<div class="qbar"><div class="qprog"><i style="width:${p}%"></i></div><span class="qcount">${label}</span></div>`;
}
function qhint(kind,text){return text?`<div class="feedback ${kind}">${text}</div>`:''}
function qkind(t){return `<span class="qkind">${({choice:'单选',match:'配对',order:'排序'})[t]||'练习'}</span>`}
function go(){
 const q=N[cur].g;if(!q)return tst('这个据点还没生成闯关题');
 g={m:0,hint:'',lock:0};
 if(q.type=='match'){g.R=shuf(q.pairs.map((p,i)=>[i,p[1]]));g.Lo=shuf(q.pairs.map((p,i)=>i));g.ok={};g.d=0;g.sel=null;mt()}
 else if(q.type=='choice'){g.ok=0;g.O=shuf(q.opts.map((t,i)=>[i,t]));ch()}
 else{g.S=shuf(q.steps.map((t,i)=>[i,t]));g.k=0;od()}
}
function mt(){
 const q=N[cur].g;
 show(`<h2 style="margin:0">${q.q}</h2>${qbar(g.d,q.pairs.length,'已配对 '+g.d+' / '+q.pairs.length)}<div class="qmeta">${qkind('match')}<span>先点左边，再点右边</span><span>答错 ${g.m} 次</span></div><div class="cols"><div>${g.Lo.map(i=>`<button class="opt ${g.ok[i]?'ok':g.sel===i?'sel':''}" data-c="pl(${i})">${q.pairs[i][0]}</button>`).join('')}</div><div>${g.R.map(r=>`<button class="opt ${g.ok[r[0]]?'ok':''}" data-c="pr(${r[0]})">${r[1]}</button>`).join('')}</div></div>${qhint('bad',g.hint)}`);
}
function pl(i){if(!g.lock&&!g.ok[i]){g.sel=i;g.hint='';mt()}}
function pr(i){
 if(g.lock||g.ok[i])return;
 if(g.sel===null)return tst('先选左边的词');
 if(g.sel===i){
  g.ok[i]=1;g.d++;g.sel=null;g.hint='';
  if(g.d==N[cur].g.pairs.length){mt();return setTimeout(fin,450)}
  mt();
 }else{
  g.m++;const P=N[cur].g.pairs;
  aw(cur+'m'+g.sel,'【'+N[cur].t+'】“'+P[g.sel][0]+'”对应的说明是？',P[g.sel][1],P.filter((_,j)=>j!=g.sel).map(p=>p[1]));
  g.hint='这一对不成立，再试一次。';g.sel=null;tst('再想想～');mt();
 }
}
function ch(){
 const q=N[cur].g;
 show(`<h2 style="margin:0">${q.q}</h2><div class="qmeta">${qkind('choice')}<span>答错 ${g.m} 次</span></div>${g.O.map((o,k)=>`<button class="opt haskey ${g.ok&&o[0]==q.a?'ok':''}" data-c="pk(${k})"><span class="key">${'ABC'[k]||k+1}</span><span>${o[1]}</span></button>`).join('')}${g.ok?`<div class="feedback ok">${q.w}</div><div class="row"><button class="btn" data-c="fin()">领取奖励</button></div>`:qhint('bad',g.hint)}`);
}
function pk(k){
 if(g.ok||g.lock)return;
 const q=N[cur].g;
 if(g.O[k][0]==q.a){g.ok=1;g.hint='';ch();return}
 g.m++;aw(cur+'c','【'+N[cur].t+'】'+q.q,q.opts[q.a],q.opts.filter((_,j)=>j!=q.a));
 g.hint='不对，选项已经重新排了一次，再选选看。';g.lock=1;
 const el=document.querySelector('[data-c="pk('+k+')"]');if(el){el.classList.add('bad');el.setAttribute('aria-disabled','true')}
 tst('不对哦，选项已重新排列');
 setTimeout(()=>{g.O=shuf(g.O);g.lock=0;ch()},420);
}
function od(){

 const gen=Object.keys(N).length;$('asub').textContent=gen?('每座岛是一章，点岛进入选节。已生成 '+gen+' 个据点；标“待生成”的节还没跑 AI。'):'还没有生成任何据点。';
}
function ent(n){const c=CH[n-1];if(!c)return;const secs=SC[String(n)]||[];const gen=secs.filter((x,i)=>nodesOf(n,i).length).length;
 show(`<h2 style="margin:0">第 ${n} 章 ${c[2]}</h2>${cimp(n)?'<p class="sub">'+ico('bookmark')+'重点章节'+(S.cm[n]===1?'（你标记的）':CM[n]?'（AI 预标注）：'+CM[n]:'')+'</p>':''}<p class="sub">共 ${secs.length} 节，已生成 ${gen} 节，选一节进入。</p>${secs.map((x,i)=>{const nodes=nodesOf(n,i),d=nodes.filter(done).length;const tag=nodes.length?'▶ 可玩 '+d+'/'+nodes.length:'<span class="sub">· 待生成</span>';return `<button class="opt" data-c="sec(${n},${i})">${n}.${i+1} ${x[0]} <span class="sub">· p.${x[1]}</span> ${tag}</button>`}).join('')}<div class="row"><button class="btn alt" data-c="cl()">返回群岛</button></div>`)}
function sec(n,i){const nodes=nodesOf(n,i);if(!nodes.length)return tst('这一节还没生成内容，先在后端跑 AI 生成');const c=CH[n-1],s=SC[String(n)][i],nx=SC[String(n)][i+1];const end=nx?Math.max(s[1],nx[1]-1):(CH[n]?CH[n][4]-1:'');
 VIEW={sid:sid_of(n,i),ch:n,se:i+1};$('ititle').innerHTML=ec(c[1],26)+` ${n}.${i+1} ${s[0]}`;$('isub').textContent=`教材第 ${s[1]}${end&&end!=s[1]?'–'+end:''} 页 · 共 ${nodes.length} 个据点 · 点亮一个，后面的路才会开放。`;
 $('itoc').innerHTML=CH.map(x=>`<li>${x[2]}（p.${x[4]}）${x[0]==n?' ← 当前':''}</li>`).join('');
 freshPath=1;cl();view('isl')}
function guide(){show(`<h2 style="margin:0">玩法说明</h2><div class="txt" style="line-height:2">${ico('map')}每座岛是一章，点进去选“节”，再进入据点<br>${ico('lock')}迷雾中：前面的据点还没点亮<br><b class="sw"></b>亮边框：现在可以挑战<br><b class="sw gold"></b>金色：已点亮　${ico('star')}精通：不出错通关<br><b class="sw dim"></b>褪色：该复习了<br>🐚 贝壳：闯关和复习的奖励，可在商店换皮肤<br>${ico('bookmark')}重点：AI 预标注或你自己标记，可以取消<br>${ico('notebook')}错题本：答错自动记录，连续答对才会移出<br>${ico('clipboard')}总习题：学完几个知识点后的综合练习，可在设置里调整</div><div class="row"><button class="btn" data-c="cl()">开始探索</button></div>`)}
const TA='width:100%;box-sizing:border-box;height:90px;border-radius:16px;border:2px solid #e8dcc8;background:#fdfbf1;color:var(--animal-text-body);padding:10px;font-family:inherit';
function bp(){show(`<h2 style="margin:0">存档备份</h2><p class="sub">导出：复制下面这串文字，保存到备忘录或文件里。导入：把保存的文字粘贴到第二个框，再点导入。</p><textarea id="ex" readonly style="${TA}"></textarea><div class="row"><button class="btn alt" data-c="cp()">复制</button></div><textarea id="im" placeholder="在这里粘贴存档文字" style="${TA}"></textarea><div class="row"><button class="btn alt" data-c="cf()">返回设置</button><button class="btn" data-c="ip()">导入</button></div>`);$('ex').value=JSON.stringify(S)}
function cp(){const t=$('ex');t.select();try{navigator.clipboard.writeText(t.value).then(()=>tst('已复制'),()=>{document.execCommand('copy');tst('已复制')})}catch(e){try{document.execCommand('copy');tst('已复制')}catch(_){tst('请手动选中后复制')}}}
function ip(){try{const o=JSON.parse($('im').value);if(!o||typeof o.st!='object')throw 0;S=Object.assign(D(),o);S.cfg=Object.assign({qn:3,rel:1,ai:1},o.cfg);S.seen=1;map();view(CUR.doc?'arch':'home');cl();tst('存档已导入')}catch(e){tst('存档格式不对，请检查是否完整复制')}}
function ar(){cl();view('arch')}
function back(){CUR={doc:'',title:'',filename:'',chapters:0,sections:0,knowledge:0,pending:0,pageOffset:0};try{localStorage.removeItem('island_doc')}catch(e){}S=D();busy=0;$('ps').innerHTML='';VIEW={sid:'',ch:0,se:0};view('home')}

/* ---------- 后端接入 ---------- */
const PARAM=new URLSearchParams(location.search);
const API_BASE=(PARAM.get('api')||localStorage.getItem('island_api')||'http://127.0.0.1:8010').replace(/\/+$/,'');
let TOKEN=PARAM.get('token')||localStorage.getItem('island_token')||'';
async function api(path,opt={}){
 const h=Object.assign({},opt.headers||{});if(TOKEN)h['X-Visitor-Token']=TOKEN;
 const r=await fetch(API_BASE+path,Object.assign({},opt,{headers:h}));
 const t=r.headers.get('X-Visitor-Token');if(t){TOKEN=t;try{localStorage.setItem('island_token',t)}catch(e){}}
 if(!r.ok){let m='';try{m=(await r.text()).slice(0,160)}catch(e){}throw new Error('HTTP '+r.status+' '+m)}
 return r.json();
}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEPS=CD.steps;
function paintStep(stage,status,pct){
 const steps=stage==='merge_sources'?STEPS.filter(x=>x[0]!=='outline'):STEPS.filter(x=>x[0]!=='merge_sources');
 const idx=steps.findIndex(x=>x[0]===stage);
 const doneAll=status==='ready'||status==='partial';
 $('ps').innerHTML=steps.map((x,i)=>{const ok=doneAll||(idx>=0&&i<idx),now=!doneAll&&i===idx;return `<div class="txt" style="margin:6px 0">${ok?'✅':now?'⏳':'⬜'} ${x[1]}</div>`}).join('')+`<p class="sub" style="text-align:center">${doneAll?'处理完成':(pct!=null?'进度 '+pct+'%':'处理中…')}${TOKEN?'':' · 已拿到访客令牌'}</p>`;
}
function applyData(d){
 Object.keys(N).forEach(k=>delete N[k]);Object.keys(SC).forEach(k=>delete SC[k]);Object.keys(AM).forEach(k=>delete AM[k]);Object.keys(CM).forEach(k=>delete CM[k]);CH.length=0;
 (d.CH||[]).forEach(c=>CH.push(c));Object.assign(SC,d.SC||{});Object.assign(N,d.N||{});Object.assign(AM,d.AM||{});Object.assign(CM,d.CM||{});
 const m=d.meta||{};
 CUR={doc:m.docId||'',title:m.title||String(m.filename||'').replace(/\.[^.]+$/,''),filename:m.filename||'',chapters:m.chapters||CH.length,sections:m.sections||0,knowledge:m.knowledge||Object.keys(N).length,pending:m.pending||0,pageOffset:m.pageOffset||0,course:!!m.courseId,sourceCount:m.sourceCount||0};
 try{localStorage.setItem('island_doc',CUR.doc)}catch(e){}
 VIEW={sid:'',ch:0,se:0};
}
async function waitReady(id){
 while(true){
  const s=await api(`/api/documents/${id}/status`);
  paintStep(s.stage||'extract',s.status,s.progress);
  if(s.status==='ready'||s.status==='partial')return s;
  if(s.status==='failed')throw new Error(s.error||'处理失败');
  await new Promise(r=>setTimeout(r,2000));
 }
}
async function loadDoc(id){
 $('ps').innerHTML='<div class="txt">正在读取后端数据…</div>';
 await waitReady(id);
 const d=await api(`/api/documents/${id}/play-data`);
 applyData(d);loadState();S.doc=id;S.up=CUR.filename;S.seen=1;
 map();view('arch');
 if(CUR.pending) tst('有 '+CUR.pending+' 个知识点还在生成中，稍后刷新');
}
async function upload(file){
 if(busy)return;busy=1;S.up=file.name;
 const ps=$('ps');ps.innerHTML='<div class="txt">正在上传 '+esc(file.name)+' …</div>';
 try{
  const fd=new FormData();fd.append('file',file);
  const doc=await api('/api/documents',{method:'POST',body:fd});
  await loadDoc(doc.id);
 }catch(e){
  ps.innerHTML='<div class="txt" style="color:#b4553f">没跑通：'+esc(e.message)+'</div><p class="sub">确认后端在 '+esc(API_BASE)+' 跑着，且这个地址允许跨域。也可以先看示例教材。</p>';
 }finally{busy=0}
}
function sample(){
 Object.keys(N).forEach(k=>delete N[k]);Object.keys(SC).forEach(k=>delete SC[k]);Object.keys(AM).forEach(k=>delete AM[k]);Object.keys(CM).forEach(k=>delete CM[k]);CH.length=0;
 DEMO_CH.forEach(c=>CH.push(c));Object.assign(SC,DEMO_SC);
 Object.keys(DEMO_N).forEach(k=>{N[k]=Object.assign({},DEMO_N[k],{sid:'3.5'});if(CD.questions[k])N[k].g=CD.questions[k]});
 Object.assign(AM,DEMO_AM);Object.assign(CM,DEMO_CM);
 CUR={doc:'demo',title:CD.meta.title,filename:CD.meta.filename,chapters:DEMO_CH.length,sections:Object.values(DEMO_SC).reduce((a,b)=>a+b.length,0),knowledge:Object.keys(N).length,pending:0,pageOffset:CD.meta.pageOffset};
 loadState();S.doc='demo';S.up=CD.meta.filename;S.seen=1;$('ps').innerHTML='';VIEW={sid:'',ch:0,se:0};map();view('arch');
}
function resume(){const id=localStorage.getItem('island_doc');if(!id)return tst('还没有接上过的书');loadDoc(id)}
document.addEventListener('change',e=>{if(e.target.id=='fi'&&e.target.files[0])upload(e.target.files[0]);if(e.target.id=='sfi'&&e.target.files.length)supFiles(e.target.files);if(e.target.id=='cfi'&&e.target.files.length)courseFiles(e.target.files)});
document.addEventListener('dragover',e=>{e.preventDefault()});
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&$('home').style.display!='none')upload(f)});
const imp=i=>S.mk[i]!==undefined?!!S.mk[i]:!!(AM[i]&&S.cfg.ai);
const cimp=n=>S.cm[n]!==undefined?!!S.cm[n]:!!(CM[n]&&S.cfg.ai);
function mkr(id){const im=imp(id),u=S.mk[id]===1,r=!u&&S.cfg.ai&&AM[id];
 return `<div class="txt" style="min-height:0;margin:8px 0">${im?ico('bookmark')+'<b>重点</b>'+(u?'（你标记的）':'（AI 预标注）')+(r?'<br><span class="sub">理由：'+AM[id]+'</span>':''):'<span class="sub">未标为重点</span>'+(S.mk[id]===0&&AM[id]?'<br><span class="sub">AI 原本的理由：'+AM[id]+'</span>':'')}<div style="text-align:right;margin-top:6px"><button class="btn alt" style="padding:6px 14px;font-size:13px" data-c="mk(${id})">${im?'取消重点':'标为重点'}</button></div></div>`}
function mk(id){S.mk[id]=imp(id)?0:1;map();if(cur==id)learn()}
function pc(n){S.cm[n]=cimp(n)?0:1;map();tst(cimp(n)?'已标为重点章节':'已取消重点章节')}
function fz(){S.fo=S.fo?0:1;map();tst(S.fo?'重点模式：只突出重点，其余变淡':'已恢复全部显示')}
function sa(v){S.cfg.ai=v;map();cf()}
(async function boot(){
 $('apiurl').textContent=API_BASE;
 if(PARAM.get('token')){TOKEN=PARAM.get('token');try{localStorage.setItem('island_token',TOKEN)}catch(e){}}
 const saved=localStorage.getItem('island_doc');
 if(saved)$('resbtn').style.display='';
 view('home');
 const want=PARAM.get('doc')||(PARAM.get('auto')==='1'?saved:'');
 if(want)loadDoc(want).catch(e=>{$('ps').innerHTML='<div class="txt" style="color:#b4553f">自动加载失败：'+esc(e.message)+'</div>'});
})();
</script></body></html>
